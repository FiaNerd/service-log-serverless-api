# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: mattiassonsofia
# "service" is the name of this project. This will also be added to your AWS resource names.
service: service-log-serverless-api

provider:
  name: aws
  region: eu-north-1
  runtime: python3.14
  architecture: arm64
  environment:
    SERVICE_LOGS_TABLE: ${env:SERVICE_LOGS_TABLE}
  iam:
    role: arn:aws:iam::${env:AWS_ACCOUNT_ID}:role/${env:LAMBDA_ROLE_NAME}

functions:
  hello:
    handler: handler.hello
    events:
      - httpApi:
          path: /
          method: get

resources:
  Resources:
    serviceLogDb:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: service-logs-db
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE

        BillingMode: PAY_PER_REQUEST
