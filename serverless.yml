org: mattiassonsofia
service: service-log-serverless-api

provider:
  name: aws
  region: eu-north-1
  runtime: python3.14
  architecture: arm64
  environment:
    SERVICE_LOGS_TABLE: ${env:SERVICE_LOGS_TABLE, 'service-logs-db'}
  iam:
    role: arn:aws:iam::${env:AWS_ACCOUNT_ID}:role/${env:LAMBDA_ROLE_NAME}

functions:
  createService:
    handler: functions/create-service-logs/lambda_function.lambda_handler
    events:
      - httpApi:
          path: /services
          method: post
  getService:
    handler: functions/get-service-logs/lambda_function.lambda_handler
    events:
      - httpApi:
          path: /services/{name}
          method: get
  updateService:
    handler: functions/update-service-logs/lambda_function.lambda_handler
    events:
      - httpApi:
          path: /services/{name}/items/{itemId}
          method: patch
  removeService:
    handler: functions/remove-service-logs/lambda_function.lambda_handler
    events:
      - httpApi:
          path: /services/{name}/items/{itemId}
          method: delete

resources:
  Resources:
    serviceLogDb:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: service-logs-db
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE

        BillingMode: PAY_PER_REQUEST
